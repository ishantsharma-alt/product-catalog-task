<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Sheet Processor</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 960px; margin: 32px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 22px; }
    .rules { color: #555; font-size: 14px; }
    button { padding: 8px 14px; margin-right: 8px; cursor: pointer; }
    button:disabled { cursor: default; }
    table { border-collapse: collapse; width: 100%; margin: 12px 0 24px; font-size: 14px; }
    th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; vertical-align: top; }
    th { background: #f5f5f5; }
    .pass { color: #1a7f37; font-weight: bold; }
    .fail { color: #c62828; font-weight: bold; }
    #results[hidden] { display: none; }
  </style>
</head>
<body>
  <h1>Product discounts &amp; Size × Pack variants</h1>
  <p class="rules">
    Products are counted by Handle in sheet order: 1–10 get 5%, 11–20 get 10%, 21+ get 15%.
    Every Size variant gets a second option, Pack (Pack of 2, Pack of 3), at the same price as its size.
  </p>

  <input type="file" id="file" accept=".csv">
  <p id="status"></p>

  <div id="results" hidden>
    <h2>Summary</h2>
    <table id="summary"></table>

    <h2>Validation</h2>
    <table id="checks"></table>

    <h2>Issues in the source file</h2>
    <ul id="issues"></ul>

    <button id="download-csv">Download import CSV</button>
    <button id="download-xlsx">Download Excel workbook</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
